name: Release Windows

# Baut die Windows-App und veroeffentlicht sie als GitHub-Release,
# sobald ein Tag wie v1.0.1 gepusht wird. Kann auch manuell gestartet werden.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
